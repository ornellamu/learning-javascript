<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>students marks</title>
</head>
<body>
    <style>
          body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .marks {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            width: 300px;
        }

        h2 {
            text-align: center;
        }

        input,  button {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background-color: #0056b3;
        }

        #result {
            margin-top: 15px;
            padding: 10px;
            background-color: #eee;
            text-align: center;
            font-weight: bold;
        }
    
    </style>
    <div class="marks">
        <h2>students marks</h2>
        <input type="text" id="names"placeholder="your names">
        <input type ="number" id="marks" placeholder="enter your marks">
        <button onclick="grades()">get your grade</button>
        <div id="result">result;</div>

    </div>
    <script>
        function grades(){
            let marks = Number(document.getElementById("marks").value);

            let result;
            if(marks >= 80){
                result = "gradeA";
            }
            else if(marks >=70 ){
                result =" gradeB";
            }
             else if(marks >=50){
                result =" gradeC";
            }
             else if(marks >= 40){
                result = "gradeD" ;
            }
            else if(marks =40){
             result = "no grade";
            }
            document.getElementById("result").textContent =" Result:"+ result;
            }
        
    </script>
</body>
</html>
